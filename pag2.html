<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomento Corporal</title>
    <link rel="shortcut icon" href="imagens/Silhueta muscular com pesos de halteres.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

</head>
<body style="background-image: linear-gradient(315deg, #767676, #CBCBCB);">
    <header class="header">
        <a href="index.html" class="logo">
            <img src="imagens/Silhueta muscular com pesos de halteres.png" alt="Logo">
        </a>

        <div class="titulo">
            <h1 data-lang="tituloSite" class="titulo-site">Fomento
   Corporal</h1>
             
        </div>
        <a href="pag2.html" class="btn" data-lang="botaoCorpo">Modele o seu Corpo</a>
    </header>
    
    <main>
        <section class="formulario">
            <h2 style="color: black;" data-lang="formulario_pg2">Calcule seu IMC (Indice de Masa Corporal)</h2>
        
            <div class="layout-imc">

                <!-- LADO ESQUERDO -->
                <div class="coluna-esquerda">
                    <div class="bloco-form">
                        <form id="imcForm" class="form-grid">
                            <input type="text" id="nome" placeholder="Nome" required>
                            <input type="number" id="altura" placeholder="Altura (m)" step="0.01" required>
                            <button type="submit" class="btn-confirmar">Confirmar</button>
            
                            <input type="text" id="cpf" placeholder="CPF" required>
                            <input type="number" id="peso" placeholder="Peso (kg)" step="0.1" required>
                            <button type="button" id="btnAtualizar" class="btn-atualizar">Resetar</button>
                        </form>
                    </div>
            
                    <!-- AGORA FICA EMBAIXO -->
                    <div id="resultado" class="resultado"></div>
                </div>
            
                <div class="lado-direito">

                    <!-- OBJETIVO -->
                    <div id="opcoes" class="opcoes">
                        <h3>Objetivo</h3>
                
                        <button>Perder peso</button>
                        <button>Ganhar peso</button>
                        <button>Definir corpo</button>
                        <button>Ganhar músculos</button>
                    </div>
                
                    <!-- TABELA -->
                    
                     <img class="tabela-imc" src="imagens/ChatGPT Image 21 de abr. de 2026, 14_28_39.png" alt="Tabela IMC">
                                   
                </div>                            
            </div>
            <div id="campoRenda" class="campo-renda">

                <label for="renda">
                    Informe sua renda mensal:
                </label>
            
                <input 
                    type="number"
                    id="renda"
                    placeholder="R$ 0,00"
                >
            
                <button id="confirmarRenda">
                    Confirmar
                </button>
            
            </div>
        </section>
    </main>

    <h1>testando para ver como vai ficar este texto</h1>
    

    <footer class="footer">
        <p>© 2026 Fomento Corporal</p>
    
        <div class="idioma">
            <label for="language">Idioma:</label>
            <select id="language">
                <option value="pt">Português</option>
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </div>
    </footer>
    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
